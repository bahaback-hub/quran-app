<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#5c2e2e" />
    <meta name="description" content="تطبيق القرآن الكريم — تلاوة، بحث، تفسير، ومواقيت الصلاة" />

    <!-- Open Graph -->
    <meta property="og:title" content="القرآن الكريم" />
    <meta property="og:description" content="تطبيق القرآن الكريم — تلاوة، استماع، بحث، تفسير، مواقيت الصلاة" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_SA" />

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Security: Strict CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: https: blob:; media-src 'self' https: blob: data:; connect-src 'self' https://api.alquran.cloud https://api.quran.com https://cdn.jsdelivr.net https://api.aladhan.com https: blob: data:; frame-src 'none'; base-uri 'self'; form-action 'self'; object-src 'none';"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>القرآن الكريم</title>
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />

    <!-- Self-hosted fonts (offline + privacy) -->
    <link rel="preload" href="./fonts/amiri-regular-400.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="./fonts/fonts.css" fetchpriority="high" />

    <!-- Preconnect to APIs -->
    <link rel="preconnect" href="https://api.alquran.cloud" />
    <link rel="preconnect" href="https://cdn.islamic.network" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="styles.css" />

    <style>
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      :focus-visible {
        outline: 3px solid #c47a12;
        outline-offset: 2px;
        border-radius: 4px;
      }
      :focus:not(:focus-visible) { outline: none; }
    </style>
  </head>

  <body>
    <div class="reading-progress" id="readingProgress" role="progressbar" aria-label="تقدم القراءة" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>

    <noscript>
      <div style="background:#fee;color:#c33;padding:20px;text-align:center;font-size:18px;border-radius:12px;margin:20px;">
        ⚠️ هذا التطبيق يحتاج إلى تفعيل JavaScript في المتصفح ليعمل.
      </div>
    </noscript>

    <a href="#surahContent" class="skip-link">تخطّي إلى المحتوى</a>

    <div class="network-banner" id="networkBanner" role="status" aria-live="polite" data-i18n="offline_banner"></div>

    <div class="container" role="application" aria-label="تطبيق القرآن الكريم">
      <!-- ========== Prayer Bar ========== -->
      <div class="prayer-bar collapsed" id="prayerBar" role="complementary" aria-label="مواقيت الصلاة">
        <div class="prayer-bar-inner">
          <div class="prayer-bar-items">
            <div class="prayer-bar-item">
              <span id="bigClockTime">--:--</span>
            </div>
            <div class="prayer-bar-item">
              <span id="nextPrayerName">جاري التحميل...</span>
              <span id="nextPrayerTime">--:--</span>
            </div>
            <div class="prayer-bar-item">
              <span id="countdownDisplay">--:--:--</span>
            </div>
          </div>
        </div>
        <button class="collapse-bar-btn" data-action="collapse-prayer-bar" aria-label="طي شريط المواقيت">▲</button>
        <button class="collapse-bar-btn" data-action="expand-prayer-bar" aria-label="توسيع شريط المواقيت">▼</button>
        <div class="collapsed-preview">
          <span class="clock-only" id="collapsedClock">--:--</span>
          <span id="prayerCountdown">---</span>
        </div>
      </div>

      <!-- ========== Header ========== -->
      <header class="header">
        <div class="header-menu-container">
          <div class="header-actions">
            <div class="theme-switcher" role="group" aria-label="تبديل المظهر">
              <button class="theme-btn active" data-action="toggle-theme" data-theme="light" title="الوضع النهاري" aria-label="الوضع النهاري" aria-pressed="true">☀️</button>
              <button class="theme-btn" data-action="toggle-theme" data-theme="sepia" title="وضع السيبيا" aria-label="وضع السيبيا" aria-pressed="false">📜</button>
              <button class="theme-btn" data-action="toggle-theme" data-theme="night" title="الوضع الليلي" aria-label="الوضع الليلي" aria-pressed="false">🌙</button>
            </div>
            <button class="header-action-btn" data-action="toggle-settings" title="الإعدادات" aria-label="الإعدادات">⚙️</button>
            <button class="header-action-btn" data-action="toggle-help" title="التعليمات" aria-label="التعليمات">❓</button>
          </div>
        </div>
        <div class="header-title-row">
          <h1>📖 القرآن الكريم</h1>
          <div class="breadcrumbs" id="breadcrumbs">
            <span class="breadcrumb-item breadcrumb-surah" id="breadcrumbSurah">—</span>
          </div>
        </div>
      </header>

      <!-- ========== Controls ========== -->
      <section class="controls" aria-label="أدوات التحكم">
        <div class="controls-row">
          <div class="control-card">
            <span class="control-card-title">السورة</span>
            <select id="surahSelect" data-action="change-surah" aria-label="اختيار السورة"></select>
            <select id="reciterSelect" data-action="change-reciter" aria-label="اختيار القارئ"></select>
          </div>
          <div class="control-card">
            <span class="control-card-title">العرض</span>
            <div class="view-mode-group">
              <button class="view-mode-btn active" data-action="view-surah" aria-label="وضع السورة" aria-pressed="true">📖</button>
              <button class="view-mode-btn" data-action="view-mushaf" aria-label="وضع المصحف" aria-pressed="false">📄</button>
              <button class="view-mode-btn" data-action="view-presentation" aria-label="وضع العرض" aria-pressed="false">🖼️</button>
            </div>
          </div>
          <div class="control-card">
            <span class="control-card-title">بحث</span>
            <button data-action="toggle-search" aria-label="بحث">🔍</button>
          </div>
        </div>
      </section>

      <!-- ========== Search Results ========== -->
      <section class="search-results" id="searchResults" role="region" aria-label="نتائج البحث" aria-live="polite"></section>

      <!-- ========== Surah Content ========== -->
      <main class="surah-content" id="surahContent" role="main" aria-label="نص السورة">
        <p class="loading" data-i18n="select_hint">📿 اختر سورة من القائمة لعرض النص والاستماع</p>
      </main>

      <!-- ========== Footer ========== -->
      <footer class="footer">
        البيانات من <a href="https://alquran.cloud/" target="_blank" rel="noopener">AlQuran.cloud API</a>
      </footer>
    </div>

    <!-- ========== Tafsir Curtain ========== -->
    <button class="tafsir-curtain-handle" data-action="toggle-tafsir" aria-label="فتح/إغلاق التفسير">📜 التفسير</button>

    <!-- ========== Bottom Nav (mobile) ========== -->
    <nav class="bottom-nav" aria-label="شريط التنقل">
      <button class="bottom-nav-btn active" data-action="nav-tab" data-tab="quran" aria-label="القرآن">
        <span>📖</span><span>القرآن</span>
      </button>
      <button class="bottom-nav-btn" data-action="nav-tab" data-tab="player" aria-label="المشغل">
        <span>🎵</span><span>المشغل</span>
      </button>
      <button class="bottom-nav-btn" data-action="nav-tab" data-tab="controls" aria-label="الأدوات">
        <span>⚙️</span><span>أدوات</span>
      </button>
      <button class="bottom-nav-btn" data-action="nav-tab" data-tab="search" aria-label="البحث">
        <span>🔍</span><span>بحث</span>
      </button>
      <button class="bottom-nav-btn" data-action="nav-tab" data-tab="more" aria-label="القائمة">
        <span>☰</span><span>القائمة</span>
      </button>
    </nav>

    <!-- ========== Toast ========== -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- ================================================================
         HTML TEMPLATES — Solves Problem #3
         These are parsed by browser once, then cloned via JS.
         No HTML inside JavaScript template literals!
         ================================================================ -->

    <!-- Floating Player -->
    <template id="tpl-player">
      <div class="player collapsed" id="player" role="region" aria-label="المشغل">
        <div class="player-inner">
          <button data-action="prev-ayah" aria-label="الآية السابقة">⏮</button>
          <button data-action="play-pause" aria-label="تشغيل/إيقاف">▶</button>
          <button data-action="next-ayah" aria-label="الآية التالية">⏭</button>
          <span class="player-info" id="playerInfo">—</span>
        </div>
      </div>
    </template>

    <!-- Settings Panel -->
    <template id="tpl-settings-panel">
      <aside class="settings-panel" id="settingsPanel" role="complementary" aria-label="الإعدادات" aria-modal="true">
        <div class="settings-header">
          <h2>⚙️ الإعدادات</h2>
          <button data-action="close-panel" data-target="settingsPanel" aria-label="إغلاق">✖</button>
        </div>
        <div class="settings-body" id="settingsBody"></div>
      </aside>
    </template>

    <!-- Help Panel -->
    <template id="tpl-help-panel">
      <aside class="help-panel" id="helpPanel" role="complementary" aria-label="التعليمات">
        <div class="help-header">
          <h2>❓ التعليمات</h2>
          <button data-action="close-panel" data-target="helpPanel" aria-label="إغلاق">✖</button>
        </div>
        <div class="help-body">
          <h3>⌨️ اختصارات لوحة المفاتيح</h3>
          <ul>
            <li><kbd>Space</kbd> — تشغيل/إيقاف</li>
            <li><kbd>←/→</kbd> — الآية السابقة/التالية</li>
            <li><kbd>H</kbd> — وضع الحفظ</li>
            <li><kbd>N</kbd> — الوضع الليلي</li>
            <li><kbd>M</kbd> — وضع المصحف</li>
            <li><kbd>T</kbd> — التفسير</li>
            <li><kbd>Esc</kbd> — إغلاق اللوحات</li>
          </ul>
        </div>
      </aside>
    </template>

    <!-- Ayah Modal -->
    <template id="tpl-ayah-modal">
      <div class="ayah-modal hidden" id="ayahModal" role="dialog" aria-label="تفاصيل الآية" aria-modal="true">
        <div class="ayah-modal-inner">
          <div class="ayah-modal-header">
            <button data-action="close-modal" data-target="ayahModal" aria-label="إغلاق">✖</button>
            <span class="ayah-modal-title" id="ayahModalTitle">الآية</span>
          </div>
          <div class="ayah-modal-text" id="ayahModalText"></div>
          <div class="ayah-modal-actions">
            <button data-action="share-ayah">📤 مشاركة</button>
            <button data-action="copy-ayah">📋 نسخ</button>
            <button data-action="favorite-ayah">⭐ مفضلة</button>
          </div>
          <div class="ayah-modal-tafsir-body" id="ayahModalTafsirBody"></div>
        </div>
      </div>
    </template>

    <!-- Adhkar Notification -->
    <template id="tpl-adhkar-notification">
      <div class="adhkar-notification hidden" id="adhkarNotification" role="alert" aria-live="assertive">
        <div class="adhkar-notification-title" id="adhkarNotifTitle">🕌 حان وقت الأذكار</div>
        <div class="adhkar-notification-text" id="adhkarNotifText"></div>
        <button data-action="open-adhkar">🕌 فتح الأذكار</button>
        <button data-action="dismiss-adhkar">⏰ لاحقاً</button>
      </div>
    </template>

    <!-- Adhkar Add Overlay -->
    <template id="tpl-adhkar-add-overlay">
      <div class="adhkar-add-overlay hidden" id="adhkarAddOverlay" aria-modal="true">
        <div class="adhkar-add-inner">
          <h3>📝 إضافة ذكر جديد</h3>
          <button data-action="close-modal" data-target="adhkarAddOverlay">✖</button>
          <textarea id="adhkarAddText" rows="3" placeholder="اكتب الذكر هنا..."></textarea>
          <input type="number" id="adhkarAddCount" value="1" min="1" max="999" />
          <button data-action="save-adhkar">💾 حفظ</button>
        </div>
      </div>
    </template>

    <!-- Presentation Overlay -->
    <template id="tpl-presentation-overlay">
      <div class="presentation-overlay hidden" id="presentationOverlay" role="dialog" aria-modal="true">
        <div class="presentation-inner">
          <div class="presentation-header">
            <button data-action="prev-presentation-ayah">⏮</button>
            <span class="presentation-ayah-text" id="presentationAyahText"></span>
            <button data-action="next-presentation-ayah">⏭</button>
            <button data-action="close-presentation">✖</button>
          </div>
        </div>
      </div>
    </template>

    <!-- Azan Notification -->
    <template id="tpl-azan-notification">
      <div class="azan-notification hidden" id="azanNotification" role="alert" aria-live="assertive">
        <div class="azan-notification-title">🕌 حان الآن وقت الصلاة</div>
        <div class="azan-notification-prayer" id="azanNotifPrayer">---</div>
        <button data-action="stop-azan">⏹️ إيقاف الأذان</button>
      </div>
    </template>

    <!-- Surah Secrets Overlay -->
    <template id="tpl-surah-secrets-overlay">
      <div class="surah-secrets-overlay hidden" id="surahSecretsOverlay" role="dialog" aria-modal="true">
        <div class="surah-secrets-overlay-inner">
          <h3 id="surahSecretsTitle">🌟 سرّ السورة</h3>
          <button data-action="close-modal" data-target="surahSecretsOverlay">✖</button>
          <div id="surahSecretsBody"></div>
        </div>
      </div>
    </template>

    <!-- Qibla Overlay -->
    <template id="tpl-qibla-overlay">
      <div class="qibla-overlay hidden" id="qiblaOverlay" role="dialog" aria-modal="true">
        <div class="qibla-panel">
          <h2>🧭 اتجاه القبلة</h2>
          <div class="qibla-compass" id="qiblaCompass">
            <div class="qibla-needle"></div>
          </div>
          <div class="qibla-angle" id="qiblaAngle">---</div>
          <button data-action="close-modal" data-target="qiblaOverlay">✖ إغلاق</button>
        </div>
      </div>
    </template>

    <!-- Reading Stats Panel -->
    <template id="tpl-reading-stats-panel">
      <div class="settings-panel hidden" id="readingStatsPanel" role="dialog" aria-modal="true">
        <div class="settings-panel-inner">
          <div class="settings-header">
            <h3>📊 إحصائيات القراءة</h3>
            <button data-action="close-modal" data-target="readingStatsPanel">✖</button>
          </div>
          <div id="readingStatsContent"></div>
        </div>
      </div>
    </template>

    <!-- App entry point -->
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
