<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القرآن الكريم — غير متصل</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Amiri', 'Traditional Arabic', serif;
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d4d4d4;
      text-align: center;
      padding: 20px;
    }
    .offline-container {
      max-width: 500px;
    }
    .offline-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      font-size: 28px;
      color: #d4af37;
      margin-bottom: 12px;
    }
    p {
      font-size: 18px;
      line-height: 1.8;
      color: #b8b8b8;
      margin-bottom: 24px;
    }
    .retry-btn {
      background: #d4af37;
      color: #2c3e50;
      border: none;
      padding: 12px 32px;
      border-radius: 24px;
      font-size: 16px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .retry-btn:hover {
      background: #b8962e;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
    }
    .retry-btn:active { transform: translateY(0); }
    .hint {
      margin-top: 20px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📖</div>
    <h1>غير متصل بالإنترنت</h1>
    <p>يبدو أنك غير متصل بالإنترنت. يمكنك قراءة السور المحفوظة مسبقاً أو إعادة المحاولة عند استعادة الاتصال.</p>
    <button class="retry-btn" onclick="window.location.reload()">🔄 إعادة المحاولة</button>
    <p class="hint">السور التي تم تحميلها مسبقاً متاحة للقراءة بدون اتصال</p>
  </div>
</body>
</html>
