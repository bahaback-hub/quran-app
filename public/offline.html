<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="framebust.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; frame-src 'none'; child-src 'none'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none';">
  <title>القرآن الكريم — غير متصل</title>
  <link rel="stylesheet" href="offline.css" />

<body>
  <div class="offline-container">
    <div class="offline-icon">📖</div>
    <h1>غير متصل بالإنترنت</h1>
    <p>يبدو أنك غير متصل بالإنترنت. يمكنك قراءة السور المحفوظة مسبقاً أو إعادة المحاولة عند استعادة الاتصال.</p>
    <button class="retry-btn" id="retryButton" type="button">🔄 إعادة المحاولة</button>
    <p class="hint">السور التي تم تحميلها مسبقاً متاحة للقراءة بدون اتصال</p>
  </div>
  <script src="offline.js"></script>
