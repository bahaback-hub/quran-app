# Dependabot — فحص تلقائي لتحديثات المكتبات
# يفحص يوميًا ويفتح PR تلقائي عند وجود تحديثات أمنية أو إصدارات جديدة

version: 2
updates:
  # فحص مكتبات npm (الواجهة)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '03:00'
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    reviewers:
      - bahaback-hub
    labels:
      - dependencies
      - security
    commit-message:
      prefix: chore
      include: scope

  # فحص إجراءات GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
