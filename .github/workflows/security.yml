name: Security Audit

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit (moderate+ in deps + dev, mandatory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production dependencies must be free of ANY known vulnerability.
      # Dev dependencies only need to be free of high+critical, since moderate
      # dev-only advisories (e.g. Vitest path-traversal) cannot reach the built
      # bundle or the deployed site. We still surface them as a hard failure
      # below so they don't quietly accumulate.
      - name: Run npm audit on production deps (moderate+ mandatory)
        run: npm audit --audit-level=moderate --omit=dev

      - name: Run npm audit on dev deps (high+critical mandatory)
        run: npm audit --audit-level=high

      - name: Surface moderate dev-only advisories (informational, non-blocking)
        run: |
          echo "Listing any moderate dev-only advisories for visibility:"
          npm audit --audit-level=moderate || true

  license-check:
    name: License check (mandatory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for problematic licenses — fails build on copyleft
        run: |
          npx license-checker --failOn "GPL-3.0;AGPL-3.0;GPL-2.0" --production
