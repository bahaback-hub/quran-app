name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create release zip
        run: |
          cd dist && zip -r ../quran-app-${{ github.ref_name }}.zip . && cd ..
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            quran-app-*.zip
