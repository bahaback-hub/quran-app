name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Required for gh repo edit (description & topics)
  administration: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set repository description and topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo edit "${{ github.repository }}" \
            --description "تطبيق ويب PWA للقرآن الكريم — تلاوة، مصحف، تفسير، بحث، مواقيت صلاة وأذكار" \
            --add-topic quran --add-topic pwa --add-topic arabic --add-topic islam --add-topic vite --add-topic javascript
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
