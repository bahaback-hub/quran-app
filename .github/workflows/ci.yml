name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:zero-style
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run format:check
      - name: Silent catch audit — documented swallows only
        run: npm run check:silent-catches
        # Every silent catch/then-null handler in src must be documented in
        # config/silent-catches.allowed.json with a reason. A new undocumented
        # swallow (or a stale documented entry) fails the build.
      - name: Translation parity audit — all locales share the ar key set
        run: npm run check:i18n-parity
        # A key added to the source locale but forgotten in another locale
        # makes the UI show the raw key for that language.
      - name: Source file size budget
        run: npm run check:file-size
        # Keeps the known 40-50 KB modules from growing and blocks new giants.
        # Ratchet FILE_SIZE_BUDGET_KB down as the giants get split.
      - name: Dead code detection (knip) — mandatory
        run: npx knip --no-progress
        # Knip checks for unused exports, dependencies, and files.
        # Mandatory — fails the build if dead code is detected.
      - name: Circular dependency detection (madge)
        run: npm run check:circular
        # Madge detects circular imports in the TypeScript source tree.
        # Mandatory — the Phase C cleanup resolved all 16 previously
        # documented cycles (currently 0 over 266 files), so this now
        # prevents new circular imports from landing.

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run --coverage
      - name: Verify total coverage threshold (≥ 80% lines)
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "❌ coverage-summary.json not found — ensure vitest.config.js coverage.reporter includes 'json-summary'"
            exit 1
          fi
          node -e '
            const s = require("./coverage/coverage-summary.json");
            const pct = s.total.lines.pct;
            console.log(`📊 Total lines coverage: ${pct}%`);
            if (pct < 80) {
              console.error(`❌ Coverage ${pct}% is below the 80% threshold`);
              process.exit(1);
            }
            console.log(`✅ Coverage ${pct}% meets the 80% threshold`);
          '
      - name: Verify per-file coverage threshold (≥ 65% lines per source file)
        run: |
          # Prevent coverage gaming: every source file must have at least 65% line coverage.
          # Files with very low coverage indicate untested modules (real tests needed, not boosters).
          # Barrel files (state.ts, templates/index.ts, templates-panels.ts) are excluded — they only re-export.
          node -e '
            const summary = require("./coverage/coverage-summary.json");
            const failures = [];
            const THRESHOLD = 65;
            const BARREL_FILES = ["src/state.ts", "src/templates/index.ts", "src/templates-panels.ts"];
            for (const [file, data] of Object.entries(summary)) {
              if (file === "total") continue;
              if (!file.includes("/src/") || file.includes("__tests__")) continue;
              const normalized = file.replace(/\\/g, "/").split("/src/")[1];
              const srcPath = "src/" + (normalized || "");
              if (BARREL_FILES.some((b) => srcPath.endsWith(b))) continue;
              const pct = data.lines.pct;
              if (typeof pct === "number" && pct < THRESHOLD) {
                failures.push(`  ${file}: ${pct}% (lines)`);
              }
            }
            if (failures.length > 0) {
              console.error(`❌ ${failures.length} source file(s) below ${THRESHOLD}% line coverage:`);
              for (const f of failures) console.error(f);
              console.error(`\nWrite real behavioral tests for these modules — do not add "coverage-booster" tests.`);
              process.exit(1);
            }
            console.log(`✅ All source files meet the ${THRESHOLD}% per-file line coverage threshold`);
          '
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  data-integrity:
    name: Quran Data Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify bundled Quran data (114 surahs, 6236 ayahs, 604 pages, checksums)
        run: npm run verify:data

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, data-integrity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Match the project Playwright version so Chromium and its system
    # dependencies are available without an unreliable runtime download.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    needs: build
    timeout-minutes: 20
    # E2E tests are MANDATORY — no continue-on-error.
    # All network calls are mocked via e2e/fixtures/mock-network.ts
    # so tests are deterministic and don't depend on external APIs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Run only the chromium project here. The mobile-chrome project in
      # playwright.config.ts is intentionally excluded from CI — its tests
      # require mobile-specific UI adjustments that are tracked separately.
      # The standalone e2e.yml workflow also runs only chromium.
      - run: npx playwright test --project=chromium
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
