name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run --coverage
      - name: Verify total coverage threshold (≥ 80% lines)
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "❌ coverage-summary.json not found"
            exit 1
          fi
          # Parse total lines coverage percentage
          TOTAL_LINES_PCT=$(node -e "const s=require('./coverage/coverage-summary.json'); console.log(s.total.lines.pct)")
          echo "📊 Total lines coverage: ${TOTAL_LINES_PCT}%"
          if (( $(echo "$TOTAL_LINES_PCT < 80" | bc -l) )); then
            echo "❌ Coverage ${TOTAL_LINES_PCT}% is below the 80% threshold"
            exit 1
          fi
          echo "✅ Coverage ${TOTAL_LINES_PCT}% meets the 80% threshold"
      - name: Verify per-file coverage threshold (≥ 50% lines per source file)
        run: |
          # Prevent coverage gaming: every source file must have at least 50% line coverage.
          # Files with very low coverage indicate untested modules (real tests needed, not boosters).
          node -e '
            const fs = require("fs");
            const summary = require("./coverage/coverage-summary.json");
            const failures = [];
            const THRESHOLD = 50;
            for (const [file, data] of Object.entries(summary)) {
              if (file === "total") continue;
              if (!file.includes("/src/") || file.includes("__tests__")) continue;
              const pct = data.lines.pct;
              if (typeof pct === "number" && pct < THRESHOLD) {
                failures.push(`  ${file}: ${pct}% (lines)`);
              }
            }
            if (failures.length > 0) {
              console.error(`❌ ${failures.length} source file(s) below ${THRESHOLD}% line coverage:`);
              for (const f of failures) console.error(f);
              console.error(`\nWrite real behavioral tests for these modules — do not add "coverage-booster" tests.`);
              process.exit(1);
            }
            console.log(`✅ All source files meet the ${THRESHOLD}% per-file line coverage threshold`);
          '
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
