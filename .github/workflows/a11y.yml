name: Accessibility Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    name: Axe Accessibility Check
    runs-on: ubuntu-latest
    # Browser executables and system dependencies are preinstalled in the
    # version-matched image, keeping the mandatory Axe audit deterministic.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Run accessibility audit
        run: |
          npx serve dist -p 4173 &
          sleep 3
          node scripts/a11y-audit.mjs
        env:
          BASE_URL: http://localhost:4173

      - name: Upload a11y results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results
          path: a11y-results.json
          retention-days: 7
