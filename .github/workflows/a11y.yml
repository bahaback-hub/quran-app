name: Accessibility Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    name: Axe Accessibility Check
    runs-on: ubuntu-latest
    # Browser executables and system dependencies are preinstalled in the
    # version-matched image, keeping the mandatory Axe audit deterministic.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Run accessibility audit
        # The app is built with base=/quran-app/ for GitHub Pages, but a plain
        # static server mounts dist at the root. Auditing that layout would
        # exercise only an empty shell (assets 404 -> "0 violations").
        # Build a root-based variant (same code, no base prefix) so the audit
        # runs against the REAL rendered app. BOTH the build AND the preview
        # server must use base=/ - `vite preview` otherwise reads base from
        # vite.config.js (/quran-app/), where the root-built assets 404 and
        # every interactive state fails to open.
        run: |
          npx vite build --base=/ --outDir dist-a11y
          npx vite preview --outDir dist-a11y --port 4173 --base=/ &
          sleep 3
          node scripts/a11y-audit.mjs
        env:
          BASE_URL: http://localhost:4173

      - name: Upload a11y results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-results
          path: a11y-results.json
          retention-days: 7
