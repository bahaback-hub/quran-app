name: Stale Issues & PRs
description: Close inactive issues and PRs automatically after 60 days

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: |
            🔔 هذا Issue لم يُحدَّث منذ 60 يومًا.
            This issue has been inactive for 60 days.
            سيُغلق تلقائيًا خلال 14 يومًا إذا لم يحدث نشاط.
            It will be auto-closed in 14 days if no activity occurs.

          # Pull Requests
          days-before-pr-stale: 45
          days-before-pr-close: 10
          stale-pr-label: 'stale'
          stale-pr-message: |
            🔔 هذا Pull Request لم يُحدَّث منذ 45 يومًا.
            This PR has been inactive for 45 days.
            سيُغلق تلقائيًا خلال 10 أيام إذا لم يحدث نشاط.
            It will be auto-closed in 10 days if no activity occurs.

          # Exempt labels — never mark these as stale
          exempt-issue-labels: 'pinned,security,good first issue'
          exempt-pr-labels: 'pinned,security'

          # General settings
          operations-per-run: 30
          remove-stale-when-updated: true
          delete-branch: false
