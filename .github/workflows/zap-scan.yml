name: Security ZAP Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          echo $! > /tmp/preview.pid
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4173/ > /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done

      - name: ZAP Baseline Scan
        id: zap
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: 'http://127.0.0.1:4173/'
          cmd_options: '-a -j -T 5'
          rules_file_name: '.github/zap-rules.tsv'
          allow_issue_writing: false
          fail_action: false

      - name: ZAP Scan Result
        if: always()
        run: |
          echo "ZAP scan completed (may have findings — review artifacts)"
          echo "ZAP is informational only, does not block CI"

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then
            kill $(cat /tmp/preview.pid) || true
          fi

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30
          if-no-files-found: ignore
