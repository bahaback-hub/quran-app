name: Sync Prayer Times

# Disabled: the legacy Aladhan sync script is deprecated and must not overwrite
# the official prayer-times data. The daily schedule is removed, and manual runs
# are refused until the official KACST pipeline exists in the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync with Aladhan API (disabled)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse deprecated sync
        run: |
          echo "::error::scripts/sync-official-prayer-times.mjs is deprecated and must not overwrite public/data/prayer-times-1448.json."
          echo "Implement scripts/regenerate-prayer-times-official.mjs before re-enabling this workflow."
          exit 1