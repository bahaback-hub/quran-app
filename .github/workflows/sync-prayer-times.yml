name: Sync Prayer Times

on:
  schedule:
    # Run daily at 1:00 AM UTC (4:00 AM Saudi time)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync with Aladhan API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync prayer times
        run: node scripts/sync-official-prayer-times.mjs

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="sync/prayer-times-$(date -u +%F)"
          git config user.name "Prayer Times Bot"
          git config user.email "bot@quran-app.local"
          git checkout -B "$BRANCH"
          git add public/data/prayer-times-1448.json
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "chore: sync prayer times for today"
          git push --force origin "$BRANCH"
          # main is a protected branch: submit the change as a PR instead of
          # pushing directly, so the required status checks can run.
          if gh pr view "$BRANCH" --json url --jq .url > /dev/null 2>&1; then
            echo "Pull request already open — force-pushed the latest update to it."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: sync prayer times for today" \
              --body "Automated daily prayer-time sync from Aladhan (method=4, Umm Al-Qura)."
          fi