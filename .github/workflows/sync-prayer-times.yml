name: Sync Prayer Times

on:
  schedule:
    # Run daily at 1:00 AM UTC (4:00 AM Saudi time)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync with Aladhan API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync prayer times
        run: node scripts/sync-official-prayer-times.mjs

      - name: Commit changes
        run: |
          git config user.name "Prayer Times Bot"
          git config user.email "bot@quran-app.local"
          git add public/data/prayer-times-1448.json
          git diff --staged --quiet || git commit -m "chore: sync prayer times for today"
          git push
