name: Bundle Size Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  bundle-size:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Analyze bundle size
        run: |
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|---------|" >> $GITHUB_STEP_SUMMARY
          
          TOTAL=0
          TOTAL_GZIP=0
          
          for f in dist/assets/*.js; do
            SIZE=$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f" 2>/dev/null || echo 0)
            GZIP=$(gzip -c "$f" | wc -c)
            TOTAL=$((TOTAL + SIZE))
            TOTAL_GZIP=$((TOTAL_GZIP + GZIP))
            NAME=$(basename "$f")
            SIZE_KB=$(echo "scale=1; $SIZE / 1024" | bc)
            GZIP_KB=$(echo "scale=1; $GZIP / 1024" | bc)
            echo "| $NAME | ${SIZE_KB} KB | ${GZIP_KB} KB |" >> $GITHUB_STEP_SUMMARY
          done
          
          TOTAL_KB=$(echo "scale=1; $TOTAL / 1024" | bc)
          TOTAL_GZIP_KB=$(echo "scale=1; $TOTAL_GZIP / 1024" | bc)
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total JS**: ${TOTAL_KB} KB (${TOTAL_GZIP_KB} KB gzipped)" >> $GITHUB_STEP_SUMMARY
          
          # Check if total gzipped JS exceeds 300KB threshold
          if [ "$TOTAL_GZIP" -gt 307200 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Warning**: Total gzipped JS exceeds 300KB threshold!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate CSP hashes
        run: node scripts/generate-csp-hashes.mjs

      - name: Check performance budget
        run: node scripts/check-performance-budget.mjs

      - name: Upload bundle analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-analysis
          path: |
            dist/csp-generated.json
            dist/csp-headers.txt
          retention-days: 7
